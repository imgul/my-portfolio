<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#07070a" />
    <!-- seo -->
    <!-- dev defaults: the build replaces this block with tags generated from src/data/content.ts (scripts/blog.mjs → homeHeadTags) -->
    <title>Muhammad Gulzaib: Founder &amp; Senior Full Stack Engineer</title>
    <meta name="description" content="Muhammad Gulzaib (Gul), founder &amp; CEO of SynergyFlow Labs. Senior full stack engineer building AI-native SaaS with Laravel, React, RAG and agentic AI. Islamabad, Pakistan." />
    <link rel="canonical" href="https://gulzaib.vercel.app/" />
    <meta property="og:title" content="Muhammad Gulzaib: I build systems that become businesses." />
    <meta property="og:type" content="profile" />
    <meta property="og:url" content="https://gulzaib.vercel.app/" />
    <meta property="og:image" content="https://gulzaib.vercel.app/og/home.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <!-- /seo -->
    <script>
      // blog (and the legal pages it renders): apply the reader's settings before first paint (no flash of the wrong theme or size)
      try {
        if (/^\/(blog|privacy|terms|cookies)(\/|$)/.test(location.pathname)) {
          var p = JSON.parse(localStorage.getItem('gul:blog-prefs') || '{}'), t = p.theme || 'auto', d = document.documentElement.dataset
          if (t === 'dark') t = 'dim'
          if (t === 'auto') t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dim' : 'light'
          var bg = { light: '#f8f6f1', sepia: '#f3ead8', dim: '#1c1d21', night: '#14110d' }[t] || '#f8f6f1'
          d.theme = t
          d.contrast = p.contrast || 'normal'
          d.size = p.size == null ? '1' : String(p.size)
          d.font = p.font || 'serif'
          d.leading = p.leading || 'normal'
          d.width = p.width || 'normal'
          d.motion = p.motion || 'auto'
          document.documentElement.style.background = bg
          document.querySelector('meta[name="theme-color"]').setAttribute('content', bg)
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>Muhammad Gulzaib — Senior Full Stack Engineer & Founder. Email: iigulzaib@gmail.com</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
