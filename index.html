    <script>
      // blog: apply the reader's theme before first paint (no white flash)
      try {
        if (location.pathname.indexOf('/blog') === 0) {
          var p = JSON.parse(localStorage.getItem('gul:blog-prefs') || '{}'), t = p.theme || 'auto'
          if (t === 'auto') t = matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark'
          document.documentElement.dataset.theme = t
          document.documentElement.style.background = { light: '#fbfaf7', sepia: '#f4ecd8', dark: '#0c0c10' }[t]
        }
      } catch (e) {}
    </script>
